; Barograph for Elecrow CrowPanel ESP32-S3 4.2" e-paper
; Build:   pio run            Upload: pio run -t upload     Monitor: pio device monitor
; Tests:   make -C test       (native unit tests of the alarm logic)

[platformio]
default_envs = crowpanel42

[env:crowpanel42]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; serial console over the USB-C port (native USB of the ESP32-S3)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP3XX Library@^2.1.5
    adafruit/RTClib@^2.1.4
